[package]
name = "promptbox"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Prompt Box - a desktop GUI app built with egui"
license = "MIT OR Apache-2.0"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "promptbox"
path = "src/main.rs"

[dependencies]
eframe = "0.36"
egui = "0.36"
env_logger = "0.11"

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["eframe"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# egui is slow in unoptimised builds; optimise dependencies even in dev.
[profile.dev.package."*"]
opt-level = 2
