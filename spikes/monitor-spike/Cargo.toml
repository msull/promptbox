[package]
name = "monitor-spike"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
description = "Feasibility spike: place caption viewports on a chosen monitor using NSScreen geometry"
publish = false

[dependencies]
eframe = "0.36"
egui = "0.36"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSScreen"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSGeometry"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"

[profile.dev.package."*"]
opt-level = 2
