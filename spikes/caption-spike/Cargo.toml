[package]
name = "caption-spike"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
description = "Feasibility spike: closed-caption style overlay of the live partial on the main monitor"
publish = false

[dependencies]
eframe = "0.36"
egui = "0.36"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"

[profile.dev.package."*"]
opt-level = 2
